name: Validate bgns 0.4.2

on:
  push:
    branches:
      - agent/validate-bgns-0.4.2
  workflow_dispatch:

permissions:
  contents: read

env:
  _R_CHECK_LIMIT_CORES_: "true"
  _R_CHECK_CRAN_INCOMING_REMOTE_: "false"
  R_KEEP_PKG_SOURCE: "yes"

jobs:
  build-check-runtime:
    name: ${{ matrix.config.os }} / R ${{ matrix.config.r }}
    runs-on: ${{ matrix.config.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        config:
          - { os: ubuntu-latest, r: release }
          - { os: ubuntu-latest, r: devel }
          - { os: macos-14, r: release }
          - { os: windows-latest, r: release }
    env:
      _R_CHECK_FORCE_SUGGESTS_: "false"

    steps:
      - name: Checkout validation branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true

      - name: Set up Pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Reconstruct and verify the uploaded archive
        shell: python {0}
        run: |
          import hashlib
          import tarfile
          from pathlib import Path

          parts = sorted(Path("ci").glob("bgns_0.4.2.tar.gz.part*"))
          if len(parts) != 8:
              raise SystemExit(f"expected eight archive parts, found {len(parts)}")
          payload = b"".join(path.read_bytes() for path in parts)
          actual = hashlib.sha256(payload).hexdigest()
          expected = "f49bdd49be8fb5bf6d2cd49bc44db7bfcbf94e5aabce74c79de931caa04dc070"
          if actual != expected:
              raise SystemExit(f"SHA-256 mismatch: {actual} != {expected}")
          if len(payload) != 30006:
              raise SystemExit(f"archive size mismatch: {len(payload)} != 30006")

          archive = Path("validation/input/bgns_0.4.2.tar.gz")
          archive.parent.mkdir(parents=True, exist_ok=True)
          archive.write_bytes(payload)

          source = Path("validation/source")
          source.mkdir(parents=True, exist_ok=True)
          with tarfile.open(archive, "r:gz") as handle:
              handle.extractall(source)

          description = (source / "bgns" / "DESCRIPTION").read_text(encoding="utf-8")
          if "Version: 0.4.2" not in description:
              raise SystemExit("DESCRIPTION does not declare Version: 0.4.2")
          print(f"Verified exact input archive: {len(payload)} bytes; sha256={actual}")

      - name: Install core check dependencies
        shell: Rscript {0}
        run: |
          options(repos = c(CRAN = "https://cloud.r-project.org"))
          needed <- c("Matrix", "testthat", "knitr", "rmarkdown")
          missing <- needed[!vapply(needed, requireNamespace, logical(1), quietly = TRUE)]
          if (length(missing)) install.packages(missing, dependencies = TRUE)
          cat("R:", R.version.string, "\n")
          cat("Platform:", R.version$platform, "\n")

      - name: Build a canonical R source tarball
        shell: bash
        run: |
          mkdir -p validation/build
          cd validation/build
          R CMD build ../source/bgns
          test -f bgns_0.4.2.tar.gz

      - name: Install the R-built package
        shell: bash
        run: |
          mkdir -p validation/library
          R CMD INSTALL --install-tests --library=validation/library validation/build/bgns_0.4.2.tar.gz

      - name: Validate default SIMD-enabled, two-thread execution
        shell: bash
        env:
          BGNS_SIMD: "1"
          BGNS_NUM_THREADS: "2"
        run: |
          Rscript ci/runtime-mode.R validation/library validation/results/simd-2.rds

      - name: Validate scalar, single-thread execution
        shell: bash
        env:
          BGNS_SIMD: "0"
          BGNS_NUM_THREADS: "1"
        run: |
          Rscript ci/runtime-mode.R validation/library validation/results/scalar-1.rds

      - name: Compare scalar and SIMD/threaded results
        shell: bash
        run: |
          Rscript ci/compare-modes.R validation/results/scalar-1.rds validation/results/simd-2.rds

      - name: Run installed testthat suite
        shell: Rscript {0}
        run: |
          .libPaths(c(normalizePath("validation/library", winslash = "/"), .libPaths()))
          library(testthat)
          library(bgns)
          testthat::test_package("bgns", reporter = "summary")

      - name: Run R CMD check --as-cran
        shell: bash
        run: |
          R CMD check --as-cran --no-manual validation/build/bgns_0.4.2.tar.gz
          cat bgns.Rcheck/00check.log

      - name: Upload build and check records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bgns-0.4.2-${{ matrix.config.os }}-R-${{ matrix.config.r }}
          path: |
            validation/build/bgns_0.4.2.tar.gz
            validation/results
            bgns.Rcheck
          if-no-files-found: warn
          retention-days: 7

  wgcna-reference:
    name: Linux / WGCNA reference parity
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BGNS_NUM_THREADS: "1"
      _R_CHECK_LIMIT_CORES_: "true"

    steps:
      - name: Checkout validation branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Reconstruct and extract uploaded archive
        shell: python {0}
        run: |
          import hashlib
          import tarfile
          from pathlib import Path

          parts = sorted(Path("ci").glob("bgns_0.4.2.tar.gz.part*"))
          if len(parts) != 8:
              raise SystemExit(f"expected eight archive parts, found {len(parts)}")
          payload = b"".join(path.read_bytes() for path in parts)
          actual = hashlib.sha256(payload).hexdigest()
          expected = "f49bdd49be8fb5bf6d2cd49bc44db7bfcbf94e5aabce74c79de931caa04dc070"
          if actual != expected:
              raise SystemExit(f"SHA-256 mismatch: {actual} != {expected}")

          archive = Path("validation/input/bgns_0.4.2.tar.gz")
          archive.parent.mkdir(parents=True, exist_ok=True)
          archive.write_bytes(payload)
          source = Path("validation/source")
          source.mkdir(parents=True, exist_ok=True)
          with tarfile.open(archive, "r:gz") as handle:
              handle.extractall(source)

      - name: Install WGCNA and test dependencies
        shell: Rscript {0}
        run: |
          options(repos = c(CRAN = "https://cloud.r-project.org"))
          if (!requireNamespace("BiocManager", quietly = TRUE)) install.packages("BiocManager")
          BiocManager::install(c("Matrix", "testthat", "WGCNA"), ask = FALSE, update = FALSE)

      - name: Install bgns and run WGCNA parity test
        shell: bash
        run: |
          R CMD INSTALL validation/input/bgns_0.4.2.tar.gz
          Rscript -e 'library(testthat); library(bgns); test_file("validation/source/bgns/tests/testthat/test-wgcna.R", reporter = "summary")'
