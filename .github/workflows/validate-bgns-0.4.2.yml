name: Validate bgns 0.4.2

on:
  push:
    branches:
      - agent/validate-bgns-0.4.2
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-install-runtime-check:
    name: ${{ matrix.os }} / R release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-14
          - windows-latest
    env:
      _R_CHECK_FORCE_SUGGESTS_: "false"
      _R_CHECK_LIMIT_CORES_: "true"
      _R_CHECK_CRAN_INCOMING_REMOTE_: "false"
      BGNS_NUM_THREADS: "2"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - uses: r-lib/actions/setup-pandoc@v2

      - name: Reconstruct and verify uploaded source archive
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import hashlib
          from pathlib import Path
          encoded = Path("ci/bgns_0.4.2.tar.gz.b64").read_text(encoding="ascii")
          payload = base64.b64decode(encoded)
          actual = hashlib.sha256(payload).hexdigest()
          expected = "f49bdd49be8fb5bf6d2cd49bc44db7bfcbf94e5aabce74c79de931caa04dc070"
          if actual != expected:
              raise SystemExit(f"SHA-256 mismatch: {actual} != {expected}")
          Path("bgns_0.4.2.input.tar.gz").write_bytes(payload)
          print(f"Verified {len(payload)} bytes; sha256={actual}")
          PY

      - name: Extract source tree
        shell: bash
        run: |
          rm -rf validation-source
          mkdir validation-source
          tar -xzf bgns_0.4.2.input.tar.gz -C validation-source
          test "$(grep '^Version:' validation-source/bgns/DESCRIPTION | awk '{print $2}')" = "0.4.2"

      - name: Install core dependencies
        shell: Rscript {0}
        run: |
          options(repos = c(CRAN = "https://cloud.r-project.org"))
          needed <- c("Matrix", "testthat", "knitr", "rmarkdown")
          missing <- needed[!vapply(needed, requireNamespace, logical(1), quietly = TRUE)]
          if (length(missing)) install.packages(missing, dependencies = TRUE)

      - name: Build a real R source package
        shell: bash
        run: |
          R CMD build --no-manual validation-source/bgns
          test -f bgns_0.4.2.tar.gz

      - name: Install built package
        shell: bash
        run: R CMD INSTALL --install-tests bgns_0.4.2.tar.gz

      - name: Run runtime validation with default ISA policy
        shell: bash
        run: |
          BGNS_NUM_THREADS=2 Rscript ci/runtime-validation.R runtime-default.rds

      - name: Run scalar and single-thread runtime validation
        shell: bash
        run: |
          BGNS_NUM_THREADS=1 BGNS_SIMD=0 Rscript ci/runtime-validation.R runtime-scalar.rds

      - name: Compare default and scalar runtime signatures
        shell: Rscript {0}
        run: |
          comparison <- all.equal(
            readRDS("runtime-default.rds"),
            readRDS("runtime-scalar.rds"),
            tolerance = 1e-10,
            check.attributes = TRUE
          )
          if (!isTRUE(comparison)) stop(paste(comparison, collapse = "; "))

      - name: Run installed package testthat suite
        shell: Rscript {0}
        run: |
          library(testthat)
          library(bgns)
          testthat::test_package("bgns", reporter = "summary")

      - name: Run R CMD check --as-cran
        shell: bash
        run: |
          R CMD check --as-cran --no-manual bgns_0.4.2.tar.gz
          cat bgns.Rcheck/00check.log
          status="$(grep '^Status:' bgns.Rcheck/00check.log || true)"
          echo "$status"
          if echo "$status" | grep -Eq '[1-9][0-9]* (ERROR|WARNING)'; then
            exit 1
          fi

      - name: Upload check output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bgns-check-${{ matrix.os }}
          path: |
            bgns.Rcheck
            bgns_0.4.2.tar.gz
            runtime-default.rds
            runtime-scalar.rds
          retention-days: 7

  wgcna-reference:
    name: Linux WGCNA reference parity
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      _R_CHECK_LIMIT_CORES_: "true"
      BGNS_NUM_THREADS: "2"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Reconstruct and extract uploaded archive
        shell: bash
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path
          Path("bgns_0.4.2.input.tar.gz").write_bytes(
              base64.b64decode(
                  Path("ci/bgns_0.4.2.tar.gz.b64").read_text(encoding="ascii")
              )
          )
          PY
          rm -rf validation-source
          mkdir validation-source
          tar -xzf bgns_0.4.2.input.tar.gz -C validation-source

      - name: Install WGCNA and test dependencies
        shell: Rscript {0}
        run: |
          options(repos = c(CRAN = "https://cloud.r-project.org"))
          if (!requireNamespace("BiocManager", quietly = TRUE)) install.packages("BiocManager")
          if (!requireNamespace("testthat", quietly = TRUE)) install.packages("testthat")
          BiocManager::install("WGCNA", ask = FALSE, update = FALSE)

      - name: Install bgns and run WGCNA parity test
        shell: bash
        run: |
          R CMD INSTALL bgns_0.4.2.input.tar.gz
          Rscript -e 'library(testthat); library(bgns); test_file("validation-source/bgns/tests/testthat/test-wgcna.R", reporter = "summary")'
