name: Validate bgns 0.4.2

on:
  push:
    branches:
      - validation/bgns-0.4.2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-check-runtime:
    name: ${{ matrix.os }} / R release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    env:
      _R_CHECK_FORCE_SUGGESTS_: "false"
      _R_CHECK_CRAN_INCOMING_REMOTE_: "false"
      _R_CHECK_LIMIT_CORES_: "true"
      BGNS_NUM_THREADS: "2"
      R_KEEP_PKG_SOURCE: "yes"

    steps:
      - name: Checkout validation branch
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Set up Pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Set up TinyTeX
        uses: r-lib/actions/setup-tinytex@v2

      - name: Decode source archive
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          encoded = Path("validation/bgns_0.4.2.tar.gz.b64").read_text().strip()
          Path("bgns_0.4.2.input.tar.gz").write_bytes(base64.b64decode(encoded))
          PY

      - name: Extract and verify source archive
        shell: Rscript {0}
        run: |
          dir.create("validation/source", recursive = TRUE, showWarnings = FALSE)
          utils::untar("bgns_0.4.2.input.tar.gz", exdir = "validation/source")
          stopifnot(file.exists("validation/source/bgns/DESCRIPTION"))
          desc <- read.dcf("validation/source/bgns/DESCRIPTION")
          stopifnot(desc[1, "Package"] == "bgns", desc[1, "Version"] == "0.4.2")

      - name: Install required R packages
        shell: Rscript {0}
        run: |
          repos <- getOption("repos")
          needed <- c("Matrix", "testthat", "knitr", "rmarkdown")
          missing <- needed[!vapply(needed, requireNamespace, logical(1), quietly = TRUE)]
          if (length(missing)) install.packages(missing, repos = repos, Ncpus = 2)

      - name: Install WGCNA reference package on Linux
        if: runner.os == 'Linux'
        continue-on-error: true
        shell: Rscript {0}
        run: |
          if (!requireNamespace("BiocManager", quietly = TRUE)) install.packages("BiocManager")
          BiocManager::install("WGCNA", ask = FALSE, update = FALSE, Ncpus = 2)

      - name: Build source package with R CMD build
        shell: bash
        run: R CMD build validation/source/bgns

      - name: Verify built archive
        shell: Rscript {0}
        run: |
          stopifnot(file.exists("bgns_0.4.2.tar.gz"))
          dir.create("validation/built", recursive = TRUE, showWarnings = FALSE)
          utils::untar("bgns_0.4.2.tar.gz", exdir = "validation/built")
          desc <- read.dcf("validation/built/bgns/DESCRIPTION")
          stopifnot(desc[1, "Version"] == "0.4.2")

      - name: Run R CMD check --as-cran
        shell: bash
        run: R CMD check --as-cran bgns_0.4.2.tar.gz

      - name: Install built package
        shell: bash
        run: R CMD INSTALL --preclean bgns_0.4.2.tar.gz

      - name: Run targeted runtime validation
        shell: Rscript {0}
        run: source("validation/runtime-validation.R", echo = TRUE)

      - name: Show check summary
        if: always()
        shell: bash
        run: |
          if [ -f bgns.Rcheck/00check.log ]; then
            tail -n 120 bgns.Rcheck/00check.log
          fi

      - name: Upload check artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bgns-0.4.2-${{ runner.os }}
          path: |
            bgns_0.4.2.tar.gz
            bgns.Rcheck/00check.log
            bgns.Rcheck/tests
          if-no-files-found: ignore
