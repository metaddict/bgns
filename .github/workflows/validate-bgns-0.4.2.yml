name: Validate uploaded bgns 0.4.2

on:
  push:
    branches:
      - validation/bgns-0.4.2-runtime-20260804
  workflow_dispatch:

permissions:
  contents: read

env:
  _R_CHECK_FORCE_SUGGESTS_: "false"
  _R_CHECK_CRAN_INCOMING_REMOTE_: "false"
  _R_CHECK_LIMIT_CORES_: "true"
  BGNS_NUM_THREADS: "2"

jobs:
  build-check-runtime:
    name: ${{ matrix.os }} / R ${{ matrix.r }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        r: [release]

    steps:
      - name: Checkout validation branch
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r }}
          use-public-rspm: true

      - name: Set up Pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Reconstruct uploaded source archive
        shell: python {0}
        run: |
          from pathlib import Path
          import base64
          payload = Path("ci_payload/bgns_0.4.2.tar.gz.b64").read_text(encoding="utf-8")
          raw = base64.b64decode("".join(payload.split()), validate=True)
          out = Path("uploaded_bgns_0.4.2.tar.gz")
          out.write_bytes(raw)
          assert len(raw) == 30006, len(raw)

      - name: Install check dependencies
        shell: Rscript {0}
        run: |
          options(repos = c(CRAN = "https://cloud.r-project.org"))
          install.packages(c("testthat", "knitr", "rmarkdown"))
          stopifnot(requireNamespace("Matrix", quietly = TRUE))

      - name: Extract source and verify metadata
        shell: Rscript {0}
        run: |
          dir.create("source", showWarnings = FALSE)
          utils::untar("uploaded_bgns_0.4.2.tar.gz", exdir = "source")
          d <- read.dcf("source/bgns/DESCRIPTION")
          stopifnot(d[1, "Package"] == "bgns", d[1, "Version"] == "0.4.2")

      - name: Build real R source tarball
        shell: bash
        run: |
          rm -f bgns_0.4.2.tar.gz
          R CMD build source/bgns
          test -f bgns_0.4.2.tar.gz

      - name: R CMD check --as-cran
        shell: bash
        run: |
          R CMD check --as-cran bgns_0.4.2.tar.gz

      - name: Install built package
        shell: bash
        run: |
          R CMD INSTALL --preclean bgns_0.4.2.tar.gz

      - name: Run extended runtime validation
        shell: Rscript {0}
        run: source("ci_payload/runtime-validation.R", echo = TRUE)

      - name: Show check summary
        if: always()
        shell: bash
        run: |
          if [ -f bgns.Rcheck/00check.log ]; then
            tail -n 120 bgns.Rcheck/00check.log
          fi

      - name: Upload check outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bgns-0.4.2-${{ runner.os }}-R-${{ matrix.r }}
          path: |
            bgns_0.4.2.tar.gz
            bgns.Rcheck/00check.log
            bgns.Rcheck/tests
          if-no-files-found: warn
