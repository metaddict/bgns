name: R package checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.config.os }} / R ${{ matrix.config.r }}
    runs-on: ${{ matrix.config.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest, r: release}
          - {os: windows-latest, r: release}
          - {os: ubuntu-latest, r: release}
          - {os: ubuntu-latest, r: devel}
          - {os: ubuntu-latest, r: '4.3'}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: 'yes'
      _R_CHECK_LIMIT_CORES_: 'true'
      BGNS_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check
      - uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--no-manual", "--as-cran")'
          build_args: 'c("--no-manual", "--compact-vignettes=gs+qpdf")'
          error-on: '"warning"'

  native-diagnostics:
    name: Linux / native diagnostics
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      BGNS_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          needs: check
      - name: Configure native diagnostics
        shell: bash
        run: |
          flags="-O1 -g -fsanitize=undefined -fno-sanitize-recover=all"
          if grep -qw avx2 /proc/cpuinfo; then flags="$flags -mavx2"; fi
          echo "CXX17FLAGS = $flags" > "$RUNNER_TEMP/Makevars-bgns"
          echo 'LDFLAGS = -fsanitize=undefined' >> "$RUNNER_TEMP/Makevars-bgns"
          echo "R_MAKEVARS_USER=$RUNNER_TEMP/Makevars-bgns" >> "$GITHUB_ENV"
      - name: Install instrumented package
        run: R CMD INSTALL --preclean .
      - name: Exercise compiled kernels
        shell: Rscript {0}
        run: |
          library(bgns)
          testthat::test_dir("tests/testthat", stop_on_failure = TRUE)
          source("tools/runtime-validation.R")
      - name: Exercise scalar fallback
        shell: Rscript {0}
        env:
          BGNS_SIMD: '0'
          BGNS_NUM_THREADS: '1'
        run: |
          library(bgns)
          testthat::test_dir("tests/testthat", stop_on_failure = TRUE)
